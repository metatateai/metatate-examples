# ---------------------------------------------------------------------------
# EXAMPLES-ONLY additions (not in the metatate-saas matrix).
#
# THE THREE-WAY PURPOSE BOUNDARY, on purpose, in one place. A reader should
# learn the boundary here rather than infer it from outcome names:
#
#   1. COVERED purpose            -> allow
#      analytics-customers-allow declares `analytics.reporting`; the policy
#      grants the `analytics` CATEGORY, so the leaf matches.
#   2. VALID purpose the policy's legacy authoring cannot cover -> review
#      support-tickets-… declares `operations.support` — a real registered
#      purpose. The policy's authored entries are legacy free strings that
#      cannot prove coverage, so it fails closed.
#   3. NO purpose at all          -> review
#      analytics-customers-purpose-missing-review asks the identical question
#      as (1) minus the purpose. One absent key, a different answer.
#
# ml-embedding-storage-review above is the sharpest case of (2): it DECLARES a
# valid `ai.inference` and STILL reviews, because the policy's authored
# `embedding_storage` entry says vectors may be STORED — which never
# established inference use. Declaring a good purpose does not rescue an
# authored entry that cannot prove coverage.
# ---------------------------------------------------------------------------
examples_only:
  - id: support-tickets-unmapped-policy-use-review
    note: a VALID declared purpose the policy's legacy authoring cannot cover
    expect: { state: review_required, decision: require_review }
  - id: analytics-customers-purpose-missing-review
    note: the SAME question with no purpose at all
    expect: { state: review_required, decision: require_review }
