# =============================================================================
# Customer 360 Sample Workspace — catalog layer.
#
# The single public source of truth for the Customer 360 sample catalog: tables,
# columns, business descriptions, tags, and the initial column classification
# against the Metatate taxonomy (built-in `pii.* / financial.* / technical.*`
# type ids, plus tenant custom types under the reserved `custom.` prefix).
# metatate-saas vendors this file (packages/test-fixtures) and derives the
# provisioned demo content from it with the REAL governance engine — nothing
# downstream is hand-authored.
# =============================================================================

connector:
  name: Customer 360 sample warehouse
  kind: postgres
# Default logical database. Individual tables may override this with
# `database: product`; the sample intentionally demonstrates governance across
# two databases through one connector.
database: master
schema: public # default schema; a table may override with its own `schema:` key

# Tenant custom data types (the `custom.` prefix is fenced — it can never
# shadow a built-in taxonomy id). Provisioned alongside the demo so the
# catalog shows taxonomy extensibility, and referenced by column
# classifications below.
customTypes:
  - id: custom.sales_region
    label: Sales region
    description: Internal sales-territory segmentation.
    sensitivity: internal
    isPii: false
  - id: custom.consent_flag
    label: Marketing consent flag
    description: A customer's recorded marketing-consent choice.
    sensitivity: confidential
    isPii: true
  - id: custom.support_free_text
    label: Support free text
    description: Customer-authored free text that may embed personal data.
    sensitivity: confidential
    isPii: true
  - id: custom.churn_risk_score
    label: Churn risk score
    description: Model-derived churn propensity for a customer account.
    sensitivity: internal
    isPii: false
  - id: custom.clinical_code
    label: Clinical code
    description: Clinical diagnosis or qualifying-condition code (illustrative).
    sensitivity: restricted
    isPii: true
  - id: custom.clinical_free_text
    label: Clinical free text
    description: Clinician-authored free text that may embed health details.
    sensitivity: restricted
    isPii: true

# Catalog collections: reusable, named sets of tables a policy can target by
# id. "Customer 360" is the everything-about-a-customer view — the
# customer-360-context policy targets the COLLECTION, so governance follows the
# set, not a hand-maintained table list.
collections:
  - id: c3609101-0000-4000-8000-000000000001
    name: Customer 360 Context
    description: Every table that contributes to the 360-degree customer view.
    members:
      - customers
      - subscriptions
      - support_tickets
      - customer_exports
      - ml_feature_store

tables:
  - name: customers
    description: Customer master data for the Customer 360 sample domain.
    tags: [pii, privacy_sensitive]
    columns:
      - name: customer_id
        dataType: uuid
        nullable: false
      - name: customer_name
        dataType: text
        nullable: false
        classification: { dataTypeId: pii.identity.full_name, sensitivity: confidential, isPii: true, source: pattern }
      - name: email
        dataType: text
        nullable: false
        description: Primary contact email address for the customer.
        tags: [contact, pii]
        classification: { dataTypeId: pii.contact.email, sensitivity: confidential, isPii: true, source: pattern }
      - name: account_status
        dataType: text
        nullable: false
      - name: arr
        dataType: numeric
        nullable: true
        classification: { dataTypeId: financial.revenue, sensitivity: internal, isPii: false, source: pattern }
      - name: region
        dataType: text
        nullable: true
        classification: { dataTypeId: custom.sales_region, sensitivity: internal, isPii: false, source: manual }
      - name: marketing_consent
        dataType: text
        nullable: true
        classification: { dataTypeId: custom.consent_flag, sensitivity: confidential, isPii: true, source: manual }
      # AdTech pack: the single legacy boolean above collapses three distinct
      # permissions; these purpose-scoped bases are the fixed model the
      # consent-requirements policy serves per declared purpose.
      - name: consent_measurement
        dataType: text
        nullable: true
        description: Recorded consent to measurement/analytics use.
        classification: { dataTypeId: custom.consent_flag, sensitivity: confidential, isPii: true, source: manual }
      - name: consent_personalization
        dataType: text
        nullable: true
        description: Recorded consent to personalization use.
        classification: { dataTypeId: custom.consent_flag, sensitivity: confidential, isPii: true, source: manual }
      - name: consent_activation
        dataType: text
        nullable: true
        description: Recorded consent to third-party activation/sharing.
        classification: { dataTypeId: custom.consent_flag, sensitivity: confidential, isPii: true, source: manual }
      - name: created_at
        dataType: timestamptz
        nullable: false
  - name: subscriptions
    description: Subscription revenue facts (plan, ARR, term).
    tags: [financial, retention_required]
    columns:
      - name: subscription_id
        dataType: uuid
        nullable: false
      - name: customer_id
        dataType: uuid
        nullable: false
      - name: plan
        dataType: text
        nullable: false
      - name: arr
        dataType: numeric
        nullable: false
        classification: { dataTypeId: financial.revenue, sensitivity: internal, isPii: false, source: pattern }
      - name: start_date
        dataType: date
        nullable: false
      - name: end_date
        dataType: date
        nullable: true
  - name: product_usage_events
    database: product
    description: Product telemetry events keyed by customer and device.
    tags: [telemetry]
    columns:
      - name: event_id
        dataType: uuid
        nullable: false
      - name: customer_id
        dataType: uuid
        nullable: false
      - name: device_id
        dataType: text
        nullable: true
        classification: { dataTypeId: technical.device_id, sensitivity: confidential, isPii: true, source: pattern }
      - name: event_name
        dataType: text
        nullable: false
      - name: occurred_at
        dataType: timestamptz
        nullable: false
  - name: support_tickets
    database: product
    description: Customer support tickets with free-text bodies.
    tags: [support, ai_training_blocked]
    columns:
      - name: ticket_id
        dataType: uuid
        nullable: false
      - name: customer_id
        dataType: uuid
        nullable: false
      - name: ticket_text
        dataType: text
        nullable: false
        description: Free-text ticket body written by the customer.
        tags: [free_text, pii]
        classification: { dataTypeId: custom.support_free_text, sensitivity: confidential, isPii: true, source: manual }
      - name: priority
        dataType: text
        nullable: false
      - name: opened_at
        dataType: timestamptz
        nullable: false
  - name: customer_exports
    description: Prepared customer export payloads awaiting destination-aware authorization.
    tags: [restricted_transfer]
    columns:
      - name: export_id
        dataType: uuid
        nullable: false
      - name: customer_id
        dataType: uuid
        nullable: false
      - name: email
        dataType: text
        nullable: false
        classification: { dataTypeId: pii.contact.email, sensitivity: restricted, isPii: true, source: pattern }
      - name: destination_system
        dataType: text
        nullable: false
      - name: exported_at
        dataType: timestamptz
        nullable: false
  - name: payment_methods
    description: Stored payment instruments for customer billing (tokenized).
    tags: [pci, billing]
    columns:
      - name: payment_method_id
        dataType: uuid
        nullable: false
      - name: customer_id
        dataType: uuid
        nullable: false
      - name: card_token
        dataType: text
        nullable: false
        description: Vault token referencing the stored card (never the PAN).
        tags: [pci]
        classification: { dataTypeId: financial.credit_card, sensitivity: restricted, isPii: true, source: pattern }
      - name: card_last4
        dataType: text
        nullable: false
        classification: { dataTypeId: financial.credit_card, sensitivity: confidential, isPii: true, source: pattern }
      - name: created_at
        dataType: timestamptz
        nullable: false
  - name: employees
    description: Employee records for people operations.
    tags: [hr, pii]
    columns:
      - name: employee_id
        dataType: uuid
        nullable: false
      - name: full_name
        dataType: text
        nullable: false
        classification: { dataTypeId: pii.identity.full_name, sensitivity: confidential, isPii: true, source: pattern }
      - name: work_email
        dataType: text
        nullable: false
        classification: { dataTypeId: pii.contact.email, sensitivity: confidential, isPii: true, source: pattern }
      - name: national_id
        dataType: text
        nullable: true
        classification: { dataTypeId: pii.government_id.national_id, sensitivity: restricted, isPii: true, source: manual }
      - name: salary
        dataType: numeric
        nullable: true
        classification: { dataTypeId: financial.salary, sensitivity: restricted, isPii: true, source: pattern }
      - name: region
        dataType: text
        nullable: true
        classification: { dataTypeId: custom.sales_region, sensitivity: internal, isPii: false, source: manual }
  - name: ml_feature_store
    database: product
    description: Model features derived from product usage and revenue signals.
    tags: [ml, telemetry]
    columns:
      - name: feature_id
        dataType: uuid
        nullable: false
      - name: customer_id
        dataType: uuid
        nullable: false
      - name: churn_score
        dataType: numeric
        nullable: false
        classification: { dataTypeId: custom.churn_risk_score, sensitivity: internal, isPii: false, source: manual }
      - name: computed_at
        dataType: timestamptz
        nullable: false
  - name: legacy_customer_backup
    description: ""
    tags: []
    columns:
      - name: customer_id
        dataType: uuid
        nullable: false
      - name: customer_name
        dataType: text
        nullable: false
      - name: email
        dataType: text
        nullable: false
      - name: exported_at
        dataType: timestamptz
        nullable: true
  # The GOVERNANCE-DEBT corner: two policies deliberately disagree about
  # outreach on this table (see policies/prospect-outreach-*.yaml), so the
  # estate serves a real conflicted answer — isolated here so every other
  # case stays clean. contact_email picks up the taxonomy email mask.
  - name: marketing_prospects
    description: Inbound prospect list used by growth experiments.
    tags: [marketing]
    columns:
      - name: prospect_id
        dataType: uuid
        nullable: false
      - name: contact_email
        dataType: text
        nullable: false
        description: Prospect contact email captured from inbound forms.
        tags: [contact, pii]
        classification: { dataTypeId: pii.contact.email, sensitivity: confidential, isPii: true, source: pattern }
      - name: campaign_tag
        dataType: text
        nullable: true
      - name: outreach_consent
        dataType: text
        nullable: true
        classification: { dataTypeId: custom.consent_flag, sensitivity: confidential, isPii: true, source: manual }
      - name: created_at
        dataType: timestamptz
        nullable: false
  # The finance schema: multi-schema realism. These two tables live under
  # `finance` (not the default `public`), and finance-data-guardrails
  # targets them through a schemas:[finance] selector.
  - name: invoices
    schema: finance
    description: Issued customer invoices for revenue recognition.
    tags: [financial]
    columns:
      - name: invoice_id
        dataType: uuid
        nullable: false
      - name: customer_id
        dataType: uuid
        nullable: false
      - name: amount
        dataType: numeric
        nullable: false
        classification: { dataTypeId: financial.revenue, sensitivity: internal, isPii: false, source: pattern }
      - name: issued_at
        dataType: date
        nullable: false
      - name: status
        dataType: text
        nullable: false
  - name: revenue_ledger
    schema: finance
    description: Posted ledger entries derived from invoices.
    tags: [financial]
    columns:
      - name: entry_id
        dataType: uuid
        nullable: false
      - name: invoice_id
        dataType: uuid
        nullable: false
      - name: amount
        dataType: numeric
        nullable: false
        classification: { dataTypeId: financial.revenue, sensitivity: internal, isPii: false, source: pattern }
      - name: posted_at
        dataType: timestamptz
        nullable: false
      - name: ledger_account
        dataType: text
        nullable: false
  # ---------------------------------------------------------------------------
  # AdTech pack: audiences derived only from consented signals; activation is
  # a destination-aware transfer on its OWN table (never on customers, so the
  # existing transfer-guardrails policy keeps its lane untouched).
  # ---------------------------------------------------------------------------
  - name: ad_audience_exports
    description: Activation audiences awaiting destination-aware authorization.
    tags: [marketing, restricted_transfer]
    columns:
      - name: export_id
        dataType: uuid
        nullable: false
      - name: customer_id
        dataType: uuid
        nullable: false
      - name: audience_segment
        dataType: text
        nullable: false
        description: Audience derived only from consented signals.
      - name: destination_system
        dataType: text
        nullable: false
      - name: activated_at
        dataType: timestamptz
        nullable: true
  # ---------------------------------------------------------------------------
  # Payments pack: the same transaction's truth is distributed across three
  # systems that disagree in real time; the authoritative source depends on
  # the QUESTION, and the policies serve that judgment.
  # ---------------------------------------------------------------------------
  - name: payment_transactions
    schema: finance
    description: Local payment processing ledger for customer transactions.
    tags: [financial, payments]
    columns:
      - name: transaction_id
        dataType: uuid
        nullable: false
      - name: customer_id
        dataType: uuid
        nullable: false
      - name: amount
        dataType: numeric
        nullable: false
        classification: { dataTypeId: financial.revenue, sensitivity: internal, isPii: false, source: pattern }
      - name: status
        dataType: text
        nullable: false
        description: >-
          Local processing status (authorized|captured|settled_pending|reconciled)
          — what THIS system last saw, not the network truth.
      - name: settlement_state
        dataType: text
        nullable: false
        description: >-
          Local mirror of settlement progress; the authoritative settlement
          state lives in network_settlements.
      - name: occurred_at
        dataType: timestamptz
        nullable: false
  - name: processor_settlements
    schema: finance
    description: Processor-reported settlement batches and fees.
    tags: [financial, payments]
    columns:
      - name: settlement_id
        dataType: uuid
        nullable: false
      - name: transaction_id
        dataType: uuid
        nullable: false
      - name: processor_batch
        dataType: text
        nullable: false
      - name: fee_amount
        dataType: numeric
        nullable: false
        classification: { dataTypeId: financial.revenue, sensitivity: internal, isPii: false, source: pattern }
      - name: settlement_state
        dataType: text
        nullable: false
        description: Processor-reported state — authoritative for fees, not for network settlement.
      - name: settled_at
        dataType: timestamptz
        nullable: true
  - name: network_settlements
    schema: finance
    description: Network-confirmed settlement records — the reconciliation source of truth.
    tags: [financial, payments]
    columns:
      - name: network_settlement_id
        dataType: uuid
        nullable: false
      - name: transaction_id
        dataType: uuid
        nullable: false
      - name: network
        dataType: text
        nullable: false
      - name: settlement_state
        dataType: text
        nullable: false
        description: Network-confirmed settlement state — the reconciliation source of truth.
      - name: settled_at
        dataType: timestamptz
        nullable: true
  # ---------------------------------------------------------------------------
  # Healthcare pack (database: care): ONE person as four concepts — patient
  # (clinical), member (coverage), consumer (marketing), subject (research).
  # Field-level specifics are deliberately illustrative, not clinical guidance.
  # ---------------------------------------------------------------------------
  - name: member_records
    database: care
    description: One record per person, governed differently per context of use.
    tags: [health, pii, privacy_sensitive]
    columns:
      - name: member_id
        dataType: uuid
        nullable: false
      - name: member_name
        dataType: text
        nullable: false
        classification: { dataTypeId: pii.identity.full_name, sensitivity: confidential, isPii: true, source: pattern }
      - name: diagnosis_code
        dataType: text
        nullable: true
        description: Clinical diagnosis code (illustrative).
        classification: { dataTypeId: custom.clinical_code, sensitivity: restricted, isPii: true, source: manual }
      - name: clinical_notes
        dataType: text
        nullable: true
        description: Clinician-authored free text (illustrative).
        classification: { dataTypeId: custom.clinical_free_text, sensitivity: restricted, isPii: true, source: manual }
      - name: plan_id
        dataType: text
        nullable: true
        description: Coverage plan identifier.
      - name: coverage_status
        dataType: text
        nullable: true
        description: Active coverage authorization — the recorded basis for eligibility reads.
      - name: contact_email
        dataType: text
        nullable: true
        classification: { dataTypeId: pii.contact.email, sensitivity: confidential, isPii: true, source: pattern }
      - name: research_consent
        dataType: text
        nullable: true
        description: Recorded research authorization for this person's data.
        classification: { dataTypeId: custom.consent_flag, sensitivity: confidential, isPii: true, source: manual }
      - name: consumer_marketing_consent
        dataType: text
        nullable: true
        description: Recorded consumer-marketing opt-in for this person.
        classification: { dataTypeId: custom.consent_flag, sensitivity: confidential, isPii: true, source: manual }
      - name: updated_at
        dataType: timestamptz
        nullable: false
  # ---------------------------------------------------------------------------
  # Government pack (database: benefits): the fields are there, the program
  # rules are not — eligibility lives in versioned, date-effective statute
  # policies layered over the record. Mechanics illustrative by design.
  # ---------------------------------------------------------------------------
  - name: applicants
    database: benefits
    description: Benefits applications as filed; the program rules live in statute policies.
    tags: [government, pii]
    columns:
      - name: applicant_id
        dataType: uuid
        nullable: false
      - name: household_size
        dataType: integer
        nullable: false
      - name: monthly_income
        dataType: numeric
        nullable: true
        description: Income as reported at application — the income TEST lives in statute, not in this field.
      - name: categorical_flag
        dataType: text
        nullable: true
        description: Recorded categorical-program participation — the eligibility RULE lives in statute.
      - name: applied_at
        dataType: timestamptz
        nullable: false
  - name: qualifying_conditions
    database: benefits
    description: Verified qualifying conditions; governed only by the statute version not yet in force.
    tags: [government, pii]
    columns:
      - name: condition_id
        dataType: uuid
        nullable: false
      - name: applicant_id
        dataType: uuid
        nullable: false
      - name: condition_code
        dataType: text
        nullable: true
        classification: { dataTypeId: custom.clinical_code, sensitivity: restricted, isPii: true, source: manual }
      - name: verified
        dataType: boolean
        nullable: false
      - name: recorded_at
        dataType: timestamptz
        nullable: false
